services:
  official-api-proxy:
    build: .
    environment:
      OFFICIAL_PROXY_TOKEN: ${OFFICIAL_PROXY_TOKEN:?OFFICIAL_PROXY_TOKEN is required}
      PORT: "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - official-api-proxy
    environment:
      PROXY_HOSTNAME: ${PROXY_HOSTNAME:?PROXY_HOSTNAME is required}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
